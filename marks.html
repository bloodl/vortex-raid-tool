<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vortex — Marks Tracker</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14111c; color: #e9e5f2; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .page { max-width: 560px; margin: 0 auto; padding: 1.6rem 14px 4rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.2rem; }
  .muted { color: #9d94b3; } .sub { color: #9d94b3; font-size: 0.85rem; margin: 0 0 1rem; }
  .card { background: #1b1726; border: 1px solid #2a2438; border-radius: 12px; padding: 0.9rem; margin: 0.8rem 0; }
  .row { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.6rem; border-radius: 9px; background: #201c2b; border: 1px solid #2e2740; margin: 0.35rem 0; }
  .row .nm { flex: 1 1 auto; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .row .st { color: #9d94b3; font-size: 0.8rem; flex: none; }
  button { background: #2a2438; color: #e9e5f2; border: 1px solid #3a3350; border-radius: 8px; padding: 0.45rem 0.8rem; font-size: 0.9rem; cursor: pointer; flex: none; }
  button:hover { background: #332c44; }
  button.give { border-color: #7fd98c66; color: #a9e8b2; }
  button.undo { color: #9d94b3; font-size: 0.78rem; padding: 0.25rem 0.55rem; }
  input, select { background: #201c2b; border: 1px solid #332c44; color: #e9e5f2; border-radius: 8px; padding: 0.55rem 0.7rem; font-size: 0.95rem; width: 100%; }
  .gate label { display: block; font-size: 0.8rem; color: #9d94b3; margin: 0.7rem 0 0.25rem; }
  .err { background: #3a2030; border: 1px solid #ff8f8f55; color: #ffb8b8; border-radius: 10px; padding: 0.7rem 0.9rem; margin: 0.8rem 0; }
  .status { position: fixed; bottom: 0.8rem; right: 1rem; background: #1b1726; border: 1px solid #3a3350; border-radius: 999px; padding: 0.25rem 0.9rem; font-size: 0.85rem; opacity: 0; transition: opacity 0.25s; }
  .status.show { opacity: 1; }
  .tot { font-size: 0.85rem; color: #9d94b3; }
  .walkrow { display: flex; gap: 0.5rem; align-items: center; }
</style></head><body><style>
  .topnav { position: sticky; top: 0; z-index: 1000; display: flex; flex-wrap: wrap; gap: 0.1rem; align-items: center; justify-content: center;
            background: #171420; border-bottom: 1px solid #2a2438; padding: 0.4rem 0.8rem;
            font: 600 13px/1 "Segoe UI", system-ui, sans-serif; }
  .topnav .tn-logo { width: 22px; height: 22px; border-radius: 50%; margin-right: 0.45rem; flex: none; }
  .topnav a { color: #b8aed3; text-decoration: none; padding: 0.45rem 0.6rem; border-radius: 7px; white-space: nowrap; }
  .topnav a:hover { background: #241f31; color: #e9e5f2; }
  .topnav a.on { color: #b678f0; background: #241f31; }
  .topnav .tn-login { cursor: pointer; color: #cfc7e2; border: 1px solid #3a3350; margin-left: 0.35rem; }
  .topnav .tn-login:hover { background: #2a2438; color: #fff; }
  .tn-dlg { position: fixed; inset: 0; z-index: 2000; background: #0a0810cc; display: grid; place-items: center; }
  .tn-dlg .box { background: #1b1726; border: 1px solid #3a3350; border-radius: 12px; padding: 1.1rem 1.2rem; width: min(22rem, 92vw);
                 font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: #e9e5f2; }
  .tn-dlg h3 { margin: 0 0 0.2rem; font-size: 1.05rem; }
  .tn-dlg p { margin: 0 0 0.9rem; color: #9d94b3; font-size: 0.85rem; }
  .tn-dlg label { display: block; font-size: 0.78rem; color: #9d94b3; margin: 0.6rem 0 0.25rem; }
  .tn-dlg input { width: 100%; background: #201c2b; border: 1px solid #332c44; color: #e9e5f2; border-radius: 8px; padding: 0.5rem 0.7rem; font-size: 0.95rem; }
  .tn-dlg .row { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
  .tn-dlg button { border-radius: 8px; padding: 0.45rem 0.9rem; font-size: 0.9rem; cursor: pointer; border: 1px solid #3a3350; background: #241f31; color: #cfc7e2; }
  .tn-dlg button.go { border-color: #7fd98c66; color: #a9e8b2; }
  .tn-dlg .err { color: #ffb8b8; font-size: 0.85rem; min-height: 1.2em; margin-top: 0.5rem; }
</style><nav class="topnav"><img class="tn-logo" src="https://bloodl.github.io/vortex-raid-tool/icon.png" alt=""><a href="https://bloodl.github.io/vortex-raid-tool/">Home</a><a href="https://bloodl.github.io/vortex-raid-tool/rules.html">Rules</a><a href="https://bloodl.github.io/vortex-raid-tool/loot-history.html">Loot History</a><a href="https://bloodl.github.io/vortex-raid-tool/wishlist.html">Wishlist</a><a href="https://bloodl.github.io/vortex-raid-tool/assign.html">Assignments</a><a href="https://bloodl.github.io/vortex-raid-tool/api.html">Commands</a><a href="https://bloodl.github.io/vortex-raid-tool/dashboard.html" data-gate="officer" hidden>Standings 🔒</a><a href="https://bloodl.github.io/vortex-raid-tool/officers.html" data-gate="officer" hidden>Officers 🔒</a><a href="https://bloodl.github.io/vortex-raid-tool/marks.html" class="on" data-gate="officer" hidden>Marks 🔒</a><a href="https://bloodl.github.io/vortex-raid-tool/settings.html" data-gate="guildmaster" hidden>Settings 🔒</a><a class="tn-login" id="tn-login">🔑 Log in</a></nav>
<script>(function () {
  "use strict";
  var API = "https://enr.tail10d5e9.ts.net";
  var LEVELS = ["officer", "guildmaster"];
  var btn = document.getElementById("tn-login");
  function levels() {
    try { return (sessionStorage.getItem("vortexAuth") || "").split(",").filter(Boolean); } catch (e) { return []; }
  }
  function apply() {
    var have = levels();
    var els = document.querySelectorAll("[data-gate]");
    for (var i = 0; i < els.length; i++) els[i].hidden = have.indexOf(els[i].getAttribute("data-gate")) < 0;
    if (!btn) return;
    btn.textContent = have.length ? "🔓 " + (have.indexOf("guildmaster") >= 0 ? "Guildmaster" : "Officer") + " · sign out" : "🔑 Log in";
  }
  function store(level, pass, who) {
    var have = levels();
    if (have.indexOf(level) < 0) have.push(level);
    try {
      sessionStorage.setItem("vortexAuth", have.join(","));
      if (level === "officer") { sessionStorage.setItem("markskey", pass); sessionStorage.setItem("vortexOfficerKey", pass); }
      if (level === "guildmaster") sessionStorage.setItem("gmkey", pass);
      if (who) { sessionStorage.setItem("marksby", who); sessionStorage.setItem("gmby", who); }
    } catch (e) {}
  }
  function signOut() {
    var keys = ["vortexAuth", "markskey", "vortexOfficerKey", "gmkey", "marksby", "gmby"];
    try { for (var i = 0; i < keys.length; i++) sessionStorage.removeItem(keys[i]); } catch (e) {}
    apply();
  }
  // One password may be the officer passphrase, the guildmaster password, or both:
  // ask the bot about each and keep whichever levels it confirms.
  function check(path, pass) {
    return fetch(API + path + "?key=" + encodeURIComponent(pass)).then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  function verify(pass, who, done) {
    Promise.all([check("/api/marks", pass), check("/api/settings", pass)]).then(function (r) {
      if (r[0]) store("officer", pass, who);
      if (!r[1]) { apply(); done(r[0]); return; }
      store("guildmaster", pass, who);
      // Guildmaster includes officer: fetch the officer passphrase so the encrypted
      // pages and the trackers open too.
      fetch(API + "/api/settings/unlock?key=" + encodeURIComponent(pass)).then(function (u) { return u.ok ? u.json() : {}; })
        .then(function (j) { if (j && j.officerKey) store("officer", j.officerKey, who); })
        .catch(function () {})
        .then(function () { apply(); done(true); });
    });
  }
  function dialog() {
    var wrap = document.createElement("div");
    wrap.className = "tn-dlg";
    wrap.innerHTML = '<div class="box"><h3>🔑 Log in</h3><p>Officer passphrase or guildmaster password — it opens every page you have access to.</p>' +
      '<label>Passphrase</label><input id="tn-p" type="password" autocomplete="current-password">' +
      '<label>Your name <span style="opacity:.7">— shown next to every change you make</span></label><input id="tn-n" maxlength="24" placeholder="e.g. Erik">' +
      '<div class="err" id="tn-e"></div><div class="row"><button id="tn-x">Cancel</button><button class="go" id="tn-ok">Log in</button></div></div>';
    document.body.appendChild(wrap);
    var pass = wrap.querySelector("#tn-p"), who = wrap.querySelector("#tn-n"), err = wrap.querySelector("#tn-e");
    try { who.value = sessionStorage.getItem("marksby") || ""; } catch (e) {}
    pass.focus();
    var close = function () { wrap.remove(); };
    var go = function () {
      if (!API) { err.textContent = "The guild PC is not reachable from here yet."; return; }
      if (!who.value.trim()) { err.textContent = "Add your name — hand-outs and edits are logged with it."; who.focus(); return; }
      err.textContent = "Checking…";
      verify(pass.value, who.value.trim(), function (ok) {
        if (ok) { close(); if (location.hash) location.reload(); }
        else err.textContent = "That passphrase was not accepted.";
      });
    };
    wrap.querySelector("#tn-ok").addEventListener("click", go);
    wrap.querySelector("#tn-x").addEventListener("click", close);
    wrap.addEventListener("click", function (e) { if (e.target === wrap) close(); });
    wrap.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); if (e.key === "Escape") close(); });
  }
  if (btn) btn.addEventListener("click", function () { if (levels().length) signOut(); else dialog(); });
  apply();
})();</script><div class="page">
  <h1>🎖 Marks of the Illidari</h1>
  <p class="sub" id="who">Officer tracker — separate from loot priority.</p>
  <div id="app"></div>
  <div class="status" id="status"></div>
<script>
"use strict";
var API = "https://enr.tail10d5e9.ts.net" || location.origin;
var KEY = null, BY = null, state = null;
try { KEY = sessionStorage.getItem("markskey"); BY = sessionStorage.getItem("marksby"); } catch (e) {}

var app = document.getElementById("app");
var whoEl = document.getElementById("who");
var statusEl = document.getElementById("status");

function flash(text, sticky) {
  statusEl.textContent = text;
  statusEl.classList.add("show");
  if (!sticky) setTimeout(function () { statusEl.classList.remove("show"); }, 1800);
}
function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

function gate(msg) {
  state = null;
  app.innerHTML = '<div class="card gate">' + (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
    '<label>Officer passphrase</label><input id="g-key" type="password" autocomplete="current-password">' +
    '<label>Your name (logged on each hand-out)</label><input id="g-by" maxlength="24">' +
    '<p style="margin:1rem 0 0"><button class="give" id="g-go">Open tracker</button></p></div>';
  if (BY) document.getElementById("g-by").value = BY;
  var go = function () {
    KEY = document.getElementById("g-key").value;
    BY = document.getElementById("g-by").value.trim() || "officer";
    try { sessionStorage.setItem("markskey", KEY); sessionStorage.setItem("marksby", BY); } catch (e) {}
    load();
  };
  document.getElementById("g-go").addEventListener("click", go);
  document.getElementById("g-key").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
}

function api(opts) {
  var req = opts.post
    ? fetch(API + "/api/marks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.assign({ key: KEY, by: BY }, opts.post)) })
    : fetch(API + "/api/marks?key=" + encodeURIComponent(KEY || ""));
  return req.then(function (r) {
    return r.json().then(function (j) {
      if (r.status === 403) { gate("Wrong passphrase."); throw new Error("auth"); }
      if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
      return j;
    });
  });
}

function act(action, main) {
  api({ post: { action: action, main: main } })
    .then(function (j) { state = j; render(); flash(action === "undo" ? "Un-ticked" : "Handed out ✓"); })
    .catch(function (e) { if (e.message !== "auth") flash(e.message, true); });
}

function render() {
  var cost = state.perLockout * state.goldEach;
  whoEl.innerHTML = "Lockout <b>" + esc(state.lockout) + "</b> (Wed–Tue) — " + state.perLockout + " marks per raider, " + state.goldEach + "g each (" + cost + "g total). Signed in as <b>" + esc(BY) + "</b>.";
  var h = '<div class="card">';
  if (!state.rows.length) h += '<p class="muted">No requests yet this lockout — raiders use /mark request in Discord, or add a walk-up below.</p>';
  for (var k = 0; k < state.rows.length; k++) {
    var r = state.rows[k];
    h += '<div class="row"><span>' + (r.fulfilled ? "✅" : "⏳") + '</span><span class="nm">' + esc(r.main) + (r.walkUp ? ' <span class="st">(walk-up)</span>' : '') + '</span>' +
      '<span class="st">' + (r.fulfilled ? 'by ' + esc(r.fulfilledBy || '?') : 'waiting') + '</span>' +
      (r.fulfilled
        ? '<button class="undo" data-act="undo" data-k="' + k + '">undo</button>'
        : '<button class="give" data-act="given" data-k="' + k + '">✓ ' + cost + 'g</button>') +
      '</div>';
  }
  h += '</div>';
  var listed = {};
  state.rows.forEach(function (r) { listed[r.main.toLowerCase()] = 1; });
  var opts = (state.roster || []).filter(function (n) { return !listed[n.toLowerCase()]; })
    .map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
  h += '<div class="card"><div class="walkrow"><select id="walk"><option value="">Walk-up (no request)…</option>' + opts + '</select><button class="give" id="walkgo">✓ Give</button></div></div>';
  if (state.totals && state.totals.length) {
    h += '<p class="tot">All-time: ' + state.totals.map(function (t) { return esc(t.main) + ' ' + t.marks; }).join(' · ') + '</p>';
  }
  app.innerHTML = h;
  app.querySelectorAll('button[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      var row = state.rows[+b.dataset.k];
      if (row) act(b.dataset.act, row.main);
    });
  });
  var wg = document.getElementById('walkgo');
  if (wg) wg.addEventListener('click', function () {
    var w = document.getElementById('walk').value;
    if (w) act('given', w);
  });
}

function load() {
  if (KEY && !BY) {
    BY = (prompt('Your name — it is logged on every hand-out') || '').trim();
    if (!BY) return gate('Add your name so hand-outs are attributed to you.');
    try { sessionStorage.setItem('marksby', BY); } catch (e) {}
  }
  api({}).then(function (j) { state = j; render(); })
    .catch(function (e) {
      if (e.message !== 'auth') {
        whoEl.textContent = '';
        app.innerHTML = '<div class="err">Tracker server unreachable (' + esc(e.message) + ') — it runs on the guild PC. Try again in a bit, or use /mark in Discord.</div>';
      }
    });
}

if (!API || API.indexOf('http') !== 0) {
  app.innerHTML = '<div class="err">Web tracker not switched on — use /mark in Discord.</div>';
} else if (KEY) { load(); } else { gate(); }
setInterval(function () { if (state && KEY && !document.hidden) load(); }, 25000);
</script></div></body></html>
