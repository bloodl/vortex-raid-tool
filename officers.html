<script>(function () {
  "use strict";
  var API = "https://vortexraidtool.com/g/vortex";
  var DISCORD = false;
  var HUB = API && /\/g\/[a-z0-9-]+$/i.test(API) ? API.replace(/\/g\/[a-z0-9-]+$/i, "") + "/hub/" : null; // the product's front door, under a hub
  var FEATURES = {"marks":true,"council":true,"assignments":true,"imports":true};
  var EDITIONS = []; // sibling editions' sites: the pills, not the guild menu
  document.querySelectorAll("[data-feature]").forEach(function (el) { if (FEATURES[el.getAttribute("data-feature")] === false) el.remove(); });
  var LEVELS = ["officer", "guildmaster"];
  var btn = document.getElementById("tn-login");
  function levels() {
    try { return (sessionStorage.getItem("vortexAuth") || "").split(",").filter(Boolean); } catch (e) { return []; }
  }
  function apply() {
    var have = levels();
    if (have.indexOf("guildmaster") >= 0 && have.indexOf("settings") < 0) have.push("settings"); // a guildmaster opens all of Settings
    var els = document.querySelectorAll("[data-gate]");
    for (var i = 0; i < els.length; i++) els[i].hidden = have.indexOf(els[i].getAttribute("data-gate")) < 0;
    // What a reader below a level sees instead (the health card's Settings steps for an officer, 0.7).
    var nots = document.querySelectorAll("[data-gate-not]");
    for (var k = 0; k < nots.length; k++) nots[k].hidden = have.indexOf(nots[k].getAttribute("data-gate-not")) >= 0;
    if (!btn) return;
    var who = ""; try { who = sessionStorage.getItem("vrtSession") ? (sessionStorage.getItem("marksby") || "") : ""; } catch (e) {}
    btn.textContent = have.length ? "🔓 " + (who || (have.indexOf("guildmaster") >= 0 ? "Guildmaster" : have.indexOf("officer") >= 0 ? "Officer" : "Member")) + " · sign out" : "🔑 Log in";
    switcher(have.length > 0);
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // In more than one guild that uses the tool: a menu to jump to the same page in another guild.
  // The other guild's bot already holds a session cookie from the login, so /auth/switch just hands it over.
  function switcher(loggedIn) {
    var sw = document.getElementById("tn-guild");
    if (!sw) return;
    var gs = []; try { gs = JSON.parse(sessionStorage.getItem("vrtGuilds") || "[]"); } catch (e) {}
    gs = gs.filter(function (g) { return g.api === API || EDITIONS.indexOf(g.site) < 0; }); // editions have their pills
    if (!loggedIn || gs.length < 2) { sw.hidden = true; sw.innerHTML = ""; return; }
    var page = location.pathname.split("/").pop() || "";
    if (!/.html$/.test(page) || page === "index.html") page = "";
    var html = '<select aria-label="Switch guild" title="Switch guild">';
    for (var k = 0; k < gs.length; k++) html += '<option value="' + k + '"' + (gs[k].api === API ? " selected" : "") + ">" + esc(gs[k].name) + "</option>";
    sw.innerHTML = html + "</select>";
    sw.hidden = false;
    sw.querySelector("select").addEventListener("change", function () {
      var g = gs[Number(this.value)];
      if (!g || !g.api || g.api === API) return;
      location.href = g.api + "/auth/switch?return=" + encodeURIComponent((g.site || g.api + "/") + page);
    });
  }
  // The edition pills: the same page in the sibling edition. Logged in, the sibling already holds a session from
  // this login (auth.js siblingLogins), so go through its /auth/switch; otherwise the plain link.
  var ed = document.getElementById("tn-ed");
  if (ed) ed.addEventListener("click", function (e) {
    var a = e.target.closest("a[href]"); if (!a) return;
    var gs = []; try { gs = JSON.parse(sessionStorage.getItem("vrtGuilds") || "[]"); } catch (x) {}
    var g = null; for (var k = 0; k < gs.length; k++) if (gs[k].site && gs[k].site === a.getAttribute("data-site")) g = gs[k];
    var page = location.pathname.split("/").pop() || ""; if (page.slice(-5) !== ".html" || page === "index.html") page = "";
    e.preventDefault();
    location.href = g && g.api ? g.api + "/auth/switch?return=" + encodeURIComponent((g.site || g.api + "/") + page) : a.getAttribute("href") + page;
  });
  // Back from Discord: #auth=<session> — ask the bot who this is, fill the same slots the
  // passphrase login fills (session token where a key goes, Discord name as the actor,
  // the officer passphrase for the encrypted pages), then reload without the hash.
  function fromDiscord(token) {
    fetch(API + "/api/auth/session?key=" + encodeURIComponent(token)).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      history.replaceState(null, "", location.pathname + location.search);
      if (!j) { alert("Discord login didn't stick — try again."); return; }
      try {
        sessionStorage.setItem("vrtSession", token);
        sessionStorage.setItem("vrtApi", API);
        sessionStorage.setItem("vrtGuilds", JSON.stringify(j.guilds || []));
        sessionStorage.setItem("vortexAuth", (j.levels || []).join(","));
        sessionStorage.setItem("marksby", j.user.name); sessionStorage.setItem("gmby", j.user.name);
        if ((j.levels || []).indexOf("officer") >= 0) { sessionStorage.setItem("markskey", token); if (j.officerKey) sessionStorage.setItem("vortexOfficerKey", j.officerKey); }
        if ((j.levels || []).indexOf("guildmaster") >= 0 || (j.levels || []).indexOf("settings") >= 0) sessionStorage.setItem("gmkey", token); // Settings, all or the areas the roles open (B6)
      } catch (e) {}
      location.reload();
    }).catch(function () { alert("Could not finish the Discord login — try again in a moment."); });
  }
  var AUTH_KEYS = ["vortexAuth", "markskey", "vortexOfficerKey", "gmkey", "marksby", "gmby", "vrtSession", "vrtGuilds", "vrtApi"];
  function forget() { try { for (var i = 0; i < AUTH_KEYS.length; i++) sessionStorage.removeItem(AUTH_KEYS[i]); } catch (e) {} }
  var auth = location.hash.match(/(?:^#|&)auth=([0-9a-f]{64})/);
  if (auth && API) { fromDiscord(auth[1]); return; }
  // Every guild's pages share this browser tab's storage: a login stored by another guild's
  // pages is no use here. Drop it and ask this guild's bot whether it already knows us (cookie).
  var owner = null; try { owner = sessionStorage.getItem("vrtApi"); } catch (e) {}
  if (owner && API && owner !== API) {
    forget();
    if (DISCORD) { location.replace(API + "/auth/switch?quiet=1&return=" + encodeURIComponent(location.href.split("#")[0])); return; }
  }
  // A fresh tab that still has this guild's login cookie but nothing stored yet: ask the bot who we are (same origin only).
  if (!levels().length && DISCORD && API && API.indexOf(location.origin) === 0) {
    fetch(API + "/api/auth/session", { credentials: "same-origin" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { if (j && j.token) fromDiscord(j.token); }).catch(function () {});
  }
  function store(level, pass, who) {
    var have = levels();
    if (have.indexOf(level) < 0) have.push(level);
    try {
      sessionStorage.setItem("vortexAuth", have.join(","));
      sessionStorage.setItem("vrtApi", API);
      if (level === "officer") { sessionStorage.setItem("markskey", pass); sessionStorage.setItem("vortexOfficerKey", pass); }
      if (level === "guildmaster") sessionStorage.setItem("gmkey", pass);
      if (who) { sessionStorage.setItem("marksby", who); sessionStorage.setItem("gmby", who); }
    } catch (e) {}
  }
  // Sign out ends this guild's session, then leaves through the hub's own sign-out to its front page (a kit install without a hub just stays here).
  function signOut() {
    var sess = null; try { sess = sessionStorage.getItem("vrtSession"); } catch (e) {}
    var done = function () { forget(); if (HUB) location.href = HUB + "logout"; else apply(); };
    if (sess && API) fetch(API + "/api/auth/logout", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: sess }) }).then(done, done);
    else done();
  }
  // One password may be the officer passphrase, the guildmaster password, or both:
  // ask the bot about each and keep whichever levels it confirms.
  function check(path, pass) {
    return fetch(API + path + "?key=" + encodeURIComponent(pass)).then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  function verify(pass, who, done) {
    Promise.all([check("/api/marks", pass), check("/api/settings", pass)]).then(function (r) {
      if (r[0]) store("officer", pass, who);
      if (!r[1]) { apply(); done(r[0]); return; }
      store("guildmaster", pass, who);
      // Guildmaster includes officer: fetch the officer passphrase so the encrypted
      // pages and the trackers open too.
      fetch(API + "/api/settings/unlock?key=" + encodeURIComponent(pass)).then(function (u) { return u.ok ? u.json() : {}; })
        .then(function (j) { if (j && j.officerKey) store("officer", j.officerKey, who); })
        .catch(function () {})
        .then(function () { apply(); done(true); });
    });
  }
  function dialog() {
    var wrap = document.createElement("div");
    wrap.className = "tn-dlg";
    wrap.innerHTML = '<div class="box"><h3>🔑 Log in</h3>' +
      (DISCORD ? '<button class="dc" id="tn-dc">Log in with Discord</button><div class="or">or with a passphrase</div>' : '<p>Officer passphrase or guildmaster password — it opens every page you have access to.</p>') +
      '<label>Passphrase</label><input id="tn-p" type="password" autocomplete="current-password">' +
      '<p style="margin:0.3rem 0 0;font-size:0.78rem;opacity:.75">The passphrase your guild master set on the Settings page of this site — never a Battle.net, Blizzard or Discord password.</p>' +
      '<label>Your name <span style="opacity:.7">— shown next to every change you make</span></label><input id="tn-n" maxlength="24" placeholder="e.g. your main">' +
      '<div class="err" id="tn-e"></div><div class="row"><button id="tn-x">Cancel</button><button class="go" id="tn-ok">Log in</button></div></div>';
    document.body.appendChild(wrap);
    var pass = wrap.querySelector("#tn-p"), who = wrap.querySelector("#tn-n"), err = wrap.querySelector("#tn-e");
    try { who.value = sessionStorage.getItem("marksby") || ""; } catch (e) {}
    pass.focus();
    var close = function () { wrap.remove(); };
    var go = function () {
      if (!API) { err.textContent = "Login is not available on this copy of the page."; return; }
      if (!who.value.trim()) { err.textContent = "Add your name — hand-outs and edits are logged with it."; who.focus(); return; }
      err.textContent = "Checking…";
      verify(pass.value, who.value.trim(), function (ok) {
        if (ok) { close(); if (location.hash) location.reload(); }
        else err.textContent = "That passphrase was not accepted.";
      });
    };
    wrap.querySelector("#tn-ok").addEventListener("click", go);
    var dc = wrap.querySelector("#tn-dc");
    if (dc) dc.addEventListener("click", function () { location.href = API + "/auth/login?return=" + encodeURIComponent(location.href.split("#")[0]); });
    wrap.querySelector("#tn-x").addEventListener("click", close);
    wrap.addEventListener("click", function (e) { if (e.target === wrap) close(); });
    wrap.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); if (e.key === "Escape") close(); });
  }
  // With Discord login available the button goes straight there — levels come from Discord roles; the
  // passphrase dialog only remains for installs without it.
  if (btn) btn.addEventListener("click", function () {
    if (levels().length) signOut();
    else if (DISCORD && API) location.href = API + "/auth/login?return=" + encodeURIComponent(location.href.split("#")[0]);
    else dialog();
  });
  apply(); // the menubar's own links, before the page paints

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pass) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(DATA.s), iterations: 210000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.i) }, key, b64(DATA.c));
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pass = document.getElementById("p").value;
  try {
    const html = await unlock(pass);
    try { sessionStorage.setItem("vortexOfficerKey", pass); } catch {}
    document.open(); document.write(html); document.close();
  } catch { document.getElementById("e").textContent = "Wrong passphrase."; }
});
(async () => {
  try {
    const saved = sessionStorage.getItem("vortexOfficerKey");
    if (saved) { const html = await unlock(saved); document.open(); document.write(html); document.close(); }
  } catch { try { sessionStorage.removeItem("vortexOfficerKey"); } catch {} }
})();
