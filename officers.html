<script>(function () {
  "use strict";
  var API = "https://enr.tail10d5e9.ts.net";
  var FEATURES = {"marks":true,"council":true};
  document.querySelectorAll("[data-feature]").forEach(function (el) { if (FEATURES[el.getAttribute("data-feature")] === false) el.remove(); });
  var LEVELS = ["officer", "guildmaster"];
  var btn = document.getElementById("tn-login");
  function levels() {
    try { return (sessionStorage.getItem("vortexAuth") || "").split(",").filter(Boolean); } catch (e) { return []; }
  }
  function apply() {
    var have = levels();
    var els = document.querySelectorAll("[data-gate]");
    for (var i = 0; i < els.length; i++) els[i].hidden = have.indexOf(els[i].getAttribute("data-gate")) < 0;
    if (!btn) return;
    btn.textContent = have.length ? "🔓 " + (have.indexOf("guildmaster") >= 0 ? "Guildmaster" : "Officer") + " · sign out" : "🔑 Log in";
  }
  function store(level, pass, who) {
    var have = levels();
    if (have.indexOf(level) < 0) have.push(level);
    try {
      sessionStorage.setItem("vortexAuth", have.join(","));
      if (level === "officer") { sessionStorage.setItem("markskey", pass); sessionStorage.setItem("vortexOfficerKey", pass); }
      if (level === "guildmaster") sessionStorage.setItem("gmkey", pass);
      if (who) { sessionStorage.setItem("marksby", who); sessionStorage.setItem("gmby", who); }
    } catch (e) {}
  }
  function signOut() {
    var keys = ["vortexAuth", "markskey", "vortexOfficerKey", "gmkey", "marksby", "gmby"];
    try { for (var i = 0; i < keys.length; i++) sessionStorage.removeItem(keys[i]); } catch (e) {}
    apply();
  }
  // One password may be the officer passphrase, the guildmaster password, or both:
  // ask the bot about each and keep whichever levels it confirms.
  function check(path, pass) {
    return fetch(API + path + "?key=" + encodeURIComponent(pass)).then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  function verify(pass, who, done) {
    Promise.all([check("/api/marks", pass), check("/api/settings", pass)]).then(function (r) {
      if (r[0]) store("officer", pass, who);
      if (!r[1]) { apply(); done(r[0]); return; }
      store("guildmaster", pass, who);
      // Guildmaster includes officer: fetch the officer passphrase so the encrypted
      // pages and the trackers open too.
      fetch(API + "/api/settings/unlock?key=" + encodeURIComponent(pass)).then(function (u) { return u.ok ? u.json() : {}; })
        .then(function (j) { if (j && j.officerKey) store("officer", j.officerKey, who); })
        .catch(function () {})
        .then(function () { apply(); done(true); });
    });
  }
  function dialog() {
    var wrap = document.createElement("div");
    wrap.className = "tn-dlg";
    wrap.innerHTML = '<div class="box"><h3>🔑 Log in</h3><p>Officer passphrase or guildmaster password — it opens every page you have access to.</p>' +
      '<label>Passphrase</label><input id="tn-p" type="password" autocomplete="current-password">' +
      '<label>Your name <span style="opacity:.7">— shown next to every change you make</span></label><input id="tn-n" maxlength="24" placeholder="e.g. Erik">' +
      '<div class="err" id="tn-e"></div><div class="row"><button id="tn-x">Cancel</button><button class="go" id="tn-ok">Log in</button></div></div>';
    document.body.appendChild(wrap);
    var pass = wrap.querySelector("#tn-p"), who = wrap.querySelector("#tn-n"), err = wrap.querySelector("#tn-e");
    try { who.value = sessionStorage.getItem("marksby") || ""; } catch (e) {}
    pass.focus();
    var close = function () { wrap.remove(); };
    var go = function () {
      if (!API) { err.textContent = "The guild PC is not reachable from here yet."; return; }
      if (!who.value.trim()) { err.textContent = "Add your name — hand-outs and edits are logged with it."; who.focus(); return; }
      err.textContent = "Checking…";
      verify(pass.value, who.value.trim(), function (ok) {
        if (ok) { close(); if (location.hash) location.reload(); }
        else err.textContent = "That passphrase was not accepted.";
      });
    };
    wrap.querySelector("#tn-ok").addEventListener("click", go);
    wrap.querySelector("#tn-x").addEventListener("click", close);
    wrap.addEventListener("click", function (e) { if (e.target === wrap) close(); });
    wrap.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); if (e.key === "Escape") close(); });
  }
  if (btn) btn.addEventListener("click", function () { if (levels().length) signOut(); else dialog(); });
  apply();
})();</script><div class="gatewrap"><div class="card">

</div></div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pass) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(DATA.s), iterations: 210000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.i) }, key, b64(DATA.c));
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pass = document.getElementById("p").value;
  try {
    const html = await unlock(pass);
    try { sessionStorage.setItem("vortexOfficerKey", pass); } catch {}
    document.open(); document.write(html); document.close();
  } catch { document.getElementById("e").textContent = "Wrong passphrase."; }
});
(async () => {
  try {
    const saved = sessionStorage.getItem("vortexOfficerKey");
    if (saved) { const html = await unlock(saved); document.open(); document.write(html); document.close(); }
  } catch { try { sessionStorage.removeItem("vortexOfficerKey"); } catch {} }
})();
