<script>(function () {
  "use strict";
  var API = "https://enr.tail10d5e9.ts.net";
  var LEVELS = ["officer", "guildmaster"];
  var btn = document.getElementById("tn-login");
  function levels() {
    try { return (sessionStorage.getItem("vortexAuth") || "").split(",").filter(Boolean); } catch (e) { return []; }
  }
  function apply() {
    var have = levels();
    var els = document.querySelectorAll("[data-gate]");
    for (var i = 0; i < els.length; i++) els[i].hidden = have.indexOf(els[i].getAttribute("data-gate")) < 0;
    if (!btn) return;
    btn.textContent = have.length ? "🔓 " + (have.indexOf("guildmaster") >= 0 ? "Guildmaster" : "Officer") + " · sign out" : "🔑 Log in";
  }
  function store(level, pass, who) {
    var have = levels();
    if (have.indexOf(level) < 0) have.push(level);
    try {
      sessionStorage.setItem("vortexAuth", have.join(","));
      if (level === "officer") { sessionStorage.setItem("markskey", pass); sessionStorage.setItem("vortexOfficerKey", pass); }
      if (level === "guildmaster") sessionStorage.setItem("gmkey", pass);
      if (who) { sessionStorage.setItem("marksby", who); sessionStorage.setItem("gmby", who); }
    } catch (e) {}
  }
  function signOut() {
    var keys = ["vortexAuth", "markskey", "vortexOfficerKey", "gmkey", "marksby", "gmby"];
    try { for (var i = 0; i < keys.length; i++) sessionStorage.removeItem(keys[i]); } catch (e) {}
    apply();
  }
  // One password may be the officer passphrase, the guildmaster password, or both:
  // ask the bot about each and keep whichever levels it confirms.
  function check(path, pass) {
    return fetch(API + path + "?key=" + encodeURIComponent(pass)).then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  function verify(pass, who, done) {
    Promise.all([check("/api/marks", pass), check("/api/settings", pass)]).then(function (r) {
      if (r[0]) store("officer", pass, who);
      if (!r[1]) { apply(); done(r[0]); return; }
      store("guildmaster", pass, who);
      // Guildmaster includes officer: fetch the officer passphrase so the encrypted
      // pages and the trackers open too.
      fetch(API + "/api/settings/unlock?key=" + encodeURIComponent(pass)).then(function (u) { return u.ok ? u.json() : {}; })
        .then(function (j) { if (j && j.officerKey) store("officer", j.officerKey, who); })
        .catch(function () {})
        .then(function () { apply(); done(true); });
    });
  }
  function dialog() {
    var wrap = document.createElement("div");
    wrap.className = "tn-dlg";
    wrap.innerHTML = '<div class="box"><h3>🔑 Log in</h3><p>Officer passphrase or guildmaster password — it opens every page you have access to.</p>' +
      '<label>Passphrase</label><input id="tn-p" type="password" autocomplete="current-password">' +
      '<label>Your name <span style="opacity:.7">— shown next to every change you make</span></label><input id="tn-n" maxlength="24" placeholder="e.g. Erik">' +
      '<div class="err" id="tn-e"></div><div class="row"><button id="tn-x">Cancel</button><button class="go" id="tn-ok">Log in</button></div></div>';
    document.body.appendChild(wrap);
    var pass = wrap.querySelector("#tn-p"), who = wrap.querySelector("#tn-n"), err = wrap.querySelector("#tn-e");
    try { who.value = sessionStorage.getItem("marksby") || ""; } catch (e) {}
    pass.focus();
    var close = function () { wrap.remove(); };
    var go = function () {
      if (!API) { err.textContent = "The guild PC is not reachable from here yet."; return; }
      if (!who.value.trim()) { err.textContent = "Add your name — hand-outs and edits are logged with it."; who.focus(); return; }
      err.textContent = "Checking…";
      verify(pass.value, who.value.trim(), function (ok) {
        if (ok) { close(); if (location.hash) location.reload(); }
        else err.textContent = "That passphrase was not accepted.";
      });
    };
    wrap.querySelector("#tn-ok").addEventListener("click", go);
    wrap.querySelector("#tn-x").addEventListener("click", close);
    wrap.addEventListener("click", function (e) { if (e.target === wrap) close(); });
    wrap.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); if (e.key === "Escape") close(); });
  }
  if (btn) btn.addEventListener("click", function () { if (levels().length) signOut(); else dialog(); });
  apply();
})();</script><div class="page">

// The menubar's height varies (it wraps on phones), so the sticky offset is measured, not guessed.

}

function render() {
  var b = state.bosses.find(function (x) { return x.id === current; }) || state.bosses[0];
  if (!b) { app.innerHTML = '<div class="err">No boss templates.</div>'; return; }
  current = b.id;
  var roles = { tank: 0, healer: 0, melee: 0, ranged: 0 };
  state.players.forEach(function (p) { roles[p.role] = (roles[p.role] || 0) + 1; classOf[p.main] = p.cls; });
  whoEl.innerHTML = (viewing
    ? '📼 <b>' + esc(state.event.title || 'Raid') + '</b> — ' + esc(viewing) + ' · past raid, read-only'
    : "<b>" + esc(state.event.title || "Raid") + "</b> — " + esc(state.event.date) + " · " + state.players.length + " rostered (" +
      roles.tank + " tanks · " + roles.healer + " healers · " + roles.melee + " melee · " + roles.ranged + " ranged) · " + (state.live ? "live comp" : "cached comp")) +
    ' · <a href="#" id="offlogin" style="color:#b8aed3">' + (OKEY ? 'officer mode · sign out' : 'officer login') + '</a>' +
    (OKEY && !viewing ? ' · <a href="#" id="pastlink" style="color:#b8aed3">🕘 past raids</a>' : '');
  var pl0 = document.getElementById('pastlink');
  if (pl0) pl0.addEventListener('click', function (e) { e.preventDefault(); openHistory(); });
  var ol = document.getElementById('offlogin');
  if (ol) ol.addEventListener('click', function (e) {
    e.preventDefault();
    if (OKEY) { OKEY = null; try { sessionStorage.removeItem('markskey'); } catch (x) {} extra = {}; load(); return; }
    var k = prompt('Officer passphrase'); if (!k) return;
    OKEY = k; try { sessionStorage.setItem('markskey', k); } catch (x) {} render();
  });
  // Tabs grouped by zone with a small label, each button glowing in its zone colour.
  var zoneClass = function (z) { return /black temple/i.test(z) ? 'z-bt' : /hyjal/i.test(z) ? 'z-hyjal' : /raid-wide|all night/i.test(z) ? 'z-night' : ''; };
  // Two rows: the zones (All night · Black Temple · Mount Hyjal) on top, and only the
  // chosen zone's bosses underneath — switching zone swaps the whole boss row.
  var zones = [];
  state.bosses.forEach(function (x) { if (zones.indexOf(x.zone) < 0) zones.push(x.zone); });
  var zoneLabel = function (z) { return /hyjal/i.test(z) ? 'Mount Hyjal' : /raid-wide/i.test(z) ? 'All night' : z; };
  var inZone = state.bosses.filter(function (x) { return x.zone === b.zone; });
  var h = '<div class="tabs">' + pastBar() +
    '<div class="zrow">' + zones.map(function (z) {
      return '<button data-zone="' + esc(z) + '" class="zb ' + zoneClass(z) + (z === b.zone ? ' on' : '') + '"><span>' + esc(zoneLabel(z)) + '</span></button>';
    }).join('') + '</div>' +
    (inZone.length > 1 ? '<div class="brow">' + inZone.map(function (x) {
      return '<button data-id="' + x.id + '" class="' + zoneClass(x.zone) + (x.id === b.id ? ' on' : '') + '">' + esc(x.name) + '</button>';
    }).join('') + '</div>' : '') +
    '</div>';
  h += '<h2>' + esc(b.name) + ' <span class="who">' + esc(b.zone) + '</span></h2>';
  // Room diagrams: the template can list several (Illidan's phases); default one per boss id.
  // diagrams === false: no picture yet (the sheet's was wrong; a hand-drawn one is coming).
  var diags = b.diagrams === false ? [] : (b.diagrams && b.diagrams.length) ? b.diagrams : [{ file: b.id + '.jpg', caption: 'Room positions — ' + b.name }];
  diags.forEach(function (d, i) {
    h += '<figure class="diagram" id="diag' + i + '" hidden><img id="diagimg' + i + '" alt="' + esc(d.caption) + '"><figcaption>' + esc(d.caption) + '</figcaption></figure>';
  });
  if (b.warnings.length) h += '<div class="banner">⚠ ' + b.warnings.map(esc).join('<br>') + '</div>';
  if (b.pinned) h += '<div class="banner" style="background:#1d2536;border-color:#4aa8ff55;color:#a6d4ff">✎ ' + b.pinned + ' officer change' + (b.pinned === 1 ? '' : 's') + ' on this boss tonight' + (OKEY ? ' <button class="mini" id="resetpins" style="margin-left:0.6rem">↺ back to automatic</button>' : '') + '</div>';
  h += '<div class="grid">';
  b.sections.forEach(function (s) {
    // Optional slots (Teron's 6th healer) stay hidden until an officer asks for
    // them — then the engine fills with a flex pick if no real healer is spare.
    var opt = s.optional || {};
    var optBtn = (OKEY && (opt.hidden || opt.shown)) ? '<span class="pm"><button class="mini" data-extra="' + b.id + '" data-on="1" title="add the optional healer slot (flex pick if no spare healer)"' + (opt.hidden ? '' : ' disabled') + '>＋</button><button class="mini" data-extra="' + b.id + '" data-on="0" title="back to the normal healer count"' + (opt.shown && extra[b.id] ? '' : ' disabled') + '>−</button></span>' : '';
    h += '<div class="card"><h3>' + iconFor(s.title) + esc(s.title) + optBtn + '</h3>';
    s.rows.forEach(function (r, i) {
      var pl = r.list ? names(r.list) : (r.player ? name(r.player) : '<span class="warn">unfilled</span>');
      // Officer mode: every row is a dropdown of who the slot accepts; a pick swaps with the current holder.
      if (OKEY && !r.list && r.options && r.options.length) {
        var cur = r.player || '';
        var have = r.options.some(function (o) { return o.main === cur; });
        pl = (r.player ? name(r.player) : '<span class="warn">unfilled</span>') +
          '<span class="dd" title="change who does this" data-kind="pick" data-sec="' + esc(s.title) + '" data-idx="' + i + '">▾</span>';
      }
      if (OKEY && r.list && r.options && r.options.length) {
        pl += '<span class="dd" title="move someone into this stack" data-kind="move" data-sec="' + esc(s.title) + '" data-idx="' + i + '">＋▾</span>';
      }
      var ov = r.override ? ' <span class="alt" title="changed by an officer tonight">✎ ' + esc(r.override.by || 'officer') + (r.override.via === 'swap' ? ' (swap)' : '') + '</span>' : '';
      var hist = '';
      var alt = ''; // a decision, not a guessing game — alternatives stay in the data, not on the page
      var res = (r.resist ? ' <span class="alt">' + esc(r.resist) + '</span>' : '') + (r.flex ? ' <span class="alt">flex: ' + esc(r.flex) + '</span>' : '') + (r.backup ? ' <span class="alt">· backup ' + name(r.backup) + '</span>' : '');
      var wr = r.warn ? ' <span class="warn">⚠ ' + esc(r.warn) + '</span>' : '';
      var lb = r.arrow ? name(r.label) + ' →' : labelHtml(r.label);
      h += '<div class="row"><span class="lb">' + lb + '</span><span class="pl">' + pl + ov + alt + res + wr + '</span>' + hist + '</div>';
    });
    h += '</div>';
  });
  h += '</div>';
  b.notes.forEach(function (n) { h += '<p class="note">' + esc(n) + '</p>'; });
  if (b.groupsExport) {
    h += '<div class="card" style="margin-top:0.8rem"><h3>' + iconFor('groups') + 'Groups for this boss — comp-export layout <button id="copygroups" style="margin-left:auto">📋 Copy for MRT</button></h3>' +
      '<pre id="groupstext" style="margin:0;white-space:pre-wrap;font:13px/1.5 Consolas,ui-monospace,monospace;color:#cfc7e2">' + esc(b.groupsExport) + '</pre></div>';
  }
  app.innerHTML = h;
  pinTabs();
  var pb = document.getElementById('pastprev'), pn = document.getElementById('pastnext'), pk = document.getElementById('pastback');
  if (pb) pb.addEventListener('click', function () { var i = histIndex(); if (i < histDates.length - 1) viewDate(histDates[i + 1].date); });
  if (pn) pn.addEventListener('click', function () { var i = histIndex(); if (i > 0) viewDate(histDates[i - 1].date); });
  if (pk) pk.addEventListener('click', function () { viewing = null; load(); });
  app.querySelectorAll('.dd').forEach(function (chip) { chip.addEventListener('click', function (e) { e.stopPropagation(); openMenu(chip, b); }); });
  var rp = document.getElementById('resetpins');
  if (rp) rp.addEventListener('click', function () { if (confirm('Drop every officer change on this boss and go back to the automatic assignment?')) pin({ resetBoss: true }); });
  var cg = document.getElementById('copygroups');
  if (cg) cg.addEventListener('click', function () {
    var t = document.getElementById('groupstext').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { cg.textContent = '✓ Copied'; setTimeout(function () { cg.textContent = '📋 Copy for MRT'; }, 1500); })
      .catch(function () { var r = document.createRange(); r.selectNodeContents(document.getElementById('groupstext')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); cg.textContent = 'Select-all done — Ctrl+C'; });
  });
  // Optional room diagrams: shown only when the image exists on the site.
  diags.forEach(function (d, i) {
    var img = document.getElementById('diagimg' + i);
    img.onload = function () { document.getElementById('diag' + i).hidden = false; };
    img.onerror = function () { document.getElementById('diag' + i).hidden = true; };
    img.src = 'images/assign/' + d.file;
  });
  app.querySelectorAll('.tabs button[data-id]').forEach(function (btn) { btn.addEventListener('click', function () { current = btn.dataset.id; render(); try { sessionStorage.setItem('assignboss', current); sessionStorage.setItem('assignboss:' + b.zone, current); } catch (e) {} }); });
  app.querySelectorAll('.tabs button[data-zone]').forEach(function (btn) { btn.addEventListener('click', function () {
    var z = btn.dataset.zone, remembered = null;
    try { remembered = sessionStorage.getItem('assignboss:' + z); } catch (e) {}
    var pick = state.bosses.filter(function (x) { return x.zone === z && x.id === remembered; })[0] || state.bosses.filter(function (x) { return x.zone === z; })[0];
    if (!pick) return;
    current = pick.id; render(); try { sessionStorage.setItem('assignboss', current); } catch (e) {}
  }); });
  app.querySelectorAll('button[data-extra]').forEach(function (btn) { btn.addEventListener('click', function () {
    extra[btn.dataset.extra] = btn.dataset.on === '1'; btn.disabled = true; btn.textContent = '…'; load();
  }); });
}

var extra = {}; // bossId -> true while the officer wants the optional slots filled
var BYNAME = null; try { BYNAME = sessionStorage.getItem('marksby'); } catch (e) {}
// An officer's change: pinned server-side for tonight, echoed back as fresh data, pushed to every open page.
function pin(body) {
  if (!BYNAME) {
    BYNAME = (prompt('Your name (shown next to your changes)') || '').trim();
    if (!BYNAME) { render(); return; }
    try { sessionStorage.setItem('marksby', BYNAME); } catch (e) {}
  }
  var ex = Object.keys(extra).filter(function (k) { return extra[k]; });
  fetch(API + '/api/assignments/pin', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ key: OKEY, by: BYNAME, date: state.event.date, boss: current, extra: ex }, body)) })
    .then(function (r) { if (r.status === 403) { OKEY = null; try { sessionStorage.removeItem('markskey'); } catch (x) {} alert('Officer passphrase rejected.'); return load().then(function () { return null; }); } return r.json(); })
    .then(function (j) { if (!j) return; if (j.error) { alert(j.error); return load(); } state = j; lastV = j.v; render(); })
    .catch(function (e) { alert('Could not save: ' + e.message); });
}
// Officer picker: a small menu under the ▾ chip with class-coloured names (native selects can't be coloured).
var menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
document.addEventListener('click', closeMenu);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
window.addEventListener('scroll', closeMenu, true);
function openMenu(chip, b) {
  closeMenu();
  var sec = b.sections.filter(function (x) { return x.title === chip.dataset.sec; })[0];
  var idx = Number(chip.dataset.idx), row = sec && sec.rows[idx];
  if (!row) return;
  var kind = chip.dataset.kind, cur = row.player || '';
  var items = kind === 'pick' ? [{ main: '', label: '— automatic —' }].concat(row.options) : row.options;
  var m = document.createElement('div');
  m.className = 'menu';
  m.innerHTML = (kind === 'move' ? '<div class="mh">move into this stack</div>' : '') + items.map(function (o) {
    var isCur = kind === 'pick' && o.main === cur;
    var lab = o.main ? name(o.main) + (o.flex ? '<span class="flexm" title="' + esc(o.flex) + '">flex</span>' : '') : '<span class="muted" style="font-weight:400">' + esc(o.label) + '</span>';
    return '<div data-v="' + esc(o.main) + '"' + (isCur ? ' class="cur"' : '') + '>' + lab + (isCur ? ' <span class="muted">✓</span>' : '') + '</div>';
  }).join('');
  document.body.appendChild(m);
  var r = chip.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = (window.scrollY + r.bottom + 4) + 'px';
  m.addEventListener('click', function (e) {
    e.stopPropagation();
    var it = e.target.closest('[data-v]');
    if (!it) return;
    var v = it.dataset.v;
    closeMenu();
    if (kind === 'pick') pin({ section: sec.title, idx: idx, player: v || null, clear: !v });
    else if (v) pin({ section: sec.title, idx: idx, player: v, listMove: true });
  });
  menuEl = m;
}
// Past raids (officers): browse the bot's per-date snapshots. A loud bar says which date is
// on screen and "Back to tonight" is always one click away; live updates pause meanwhile.
function histIndex() { for (var i = 0; i < histDates.length; i++) if (histDates[i].date === viewing) return i; return -1; }
function pastBar() {
  if (!viewing) return '';
  var i = histIndex();
  return '<div class="pastbar">📼 Past raid: <b>' + esc(viewing) + (state.event.title ? ' · ' + esc(state.event.title) : '') + '</b> — read-only snapshot, not tonight' +
    '<span class="sp"></span><button id="pastprev"' + (i < histDates.length - 1 ? '' : ' disabled') + '>◀ older</button><button id="pastnext"' + (i > 0 ? '' : ' disabled') + '>newer ▶</button><button class="go" id="pastback">Back to tonight</button></div>';
}
function histApi(q) {
  return fetch(API + '/api/assignments/history?key=' + encodeURIComponent(OKEY || '') + (q || '')).then(function (r) {
    if (r.status === 403) { OKEY = null; try { sessionStorage.removeItem('markskey'); } catch (x) {} alert('Officer passphrase rejected.'); throw new Error('auth'); }
    return r.json();
  });
}
function openHistory() {
  histApi('').then(function (j) {
    histDates = j.dates || [];
    if (!histDates.length) { alert('No past raids recorded yet — the bot starts keeping them from the next raid night.'); return; }
    viewDate(histDates[0].date);
  }).catch(function (e) { if (e.message !== 'auth') alert(e.message); });
}
function viewDate(d) {
  histApi('&date=' + encodeURIComponent(d)).then(function (j) {
    if (j.error) { alert(j.error); return; }
    viewing = d; histDates = j.dates || histDates; state = j; render(); window.scrollTo(0, 0);
  }).catch(function (e) { if (e.message !== 'auth') alert(e.message); });
}
// Live: the server streams a version number; when it changes, refetch. Polling if the stream can't be opened.
var lastV = null, lastC = null, pollTimer = null;
function startLive() {
  var poll = function () { if (!pollTimer) pollTimer = setInterval(function () { if (!document.hidden) load(); }, 20000); };
  if (!window.EventSource) return poll();
  try {
    var es = new EventSource(API + '/api/assignments/events');
    es.onmessage = function (e) { var v = null, c = null; try { var j = JSON.parse(e.data); v = j.v; c = j.c; } catch (x) {} if ((lastV !== null && v !== lastV) || (lastC !== null && c !== lastC)) load(); lastV = v; lastC = c; };
    es.onerror = function () { es.close(); poll(); };
  } catch (e) { poll(); }
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && state) load(); });
// Officer passphrase (shared with the marks tracker's session) unlocks the add-a-healer buttons; the API checks it too.
var OKEY = null; try { OKEY = sessionStorage.getItem('markskey'); } catch (e) {}
var viewing = null, histDates = []; // officer past-raid browser: the date being viewed, and the dates on record
function load() {
  if (viewing) return Promise.resolve(); // a past raid is on screen — leave it alone until "Back to tonight"
  var ex = Object.keys(extra).filter(function (k) { return extra[k]; });
  return fetch(API + '/api/assignments' + (ex.length ? '?extra=' + encodeURIComponent(ex.join(',')) + '&key=' + encodeURIComponent(OKEY || '') : ''))
    .then(function (r) {
      if (r.status === 403) { OKEY = null; try { sessionStorage.removeItem('markskey'); } catch (x) {} extra = {}; alert('Officer passphrase rejected — adding slots needs an officer login.'); return load().then(function () { return null; }); }
      return r.json();
    })
    .then(function (j) { if (!j) return; if (j.error) throw new Error(j.error); state = j; lastV = j.v; render(); })
    .catch(function (e) { whoEl.textContent = ''; app.innerHTML = '<div class="err">Couldn\'t load assignments (' + esc(e.message) + ') — the server runs on the guild PC; try again in a bit.</div>'; });
}

if (!API || API.indexOf('http') !== 0) {
  app.innerHTML = '<div class="err">Assignments aren\'t switched on yet — ask an officer.</div>';
} else {
  try { current = sessionStorage.getItem('assignboss'); } catch (e) {}
  load();
  startLive();
}
</script></div></body></html>
