<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vortex — Raid Assignments</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14111c; color: #e9e5f2; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .page { max-width: 1060px; margin: 0 auto; padding: 1.6rem 16px 4rem; }
  h1 { font-size: 1.4rem; margin: 0 0 0.2rem; }
  h2 { font-size: 1.2rem; margin: 1.6rem 0 0.4rem; color: #e9e5f2; display: flex; align-items: center; gap: 0.6rem; }
  h3 { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: #b8aed3; margin: 0 0 0.45rem; display: flex; align-items: center; gap: 0.45rem; }
  h3 img, h2 img { width: 22px; height: 22px; border-radius: 5px; border: 1px solid #3a3350; }
  .muted { color: #9d94b3; } .sub { color: #9d94b3; font-size: 0.85rem; margin: 0 0 1rem; }
  .tabs { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.8rem 0 1.2rem; }
  .tabs button { background: #1b1726; color: #b8aed3; border: 1px solid #2a2438; border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.85rem; cursor: pointer; transition: box-shadow 0.15s; }
  /* Zone colour-coding: Black Temple glows fel green (warglaive style), Hyjal glows blue. */
  .tabs button.z-bt { border-color: #2fd77a; box-shadow: 0 0 6px #2fd77a55, inset 0 0 6px #2fd77a22; }
  .tabs button.z-hyjal { border-color: #4aa8ff; box-shadow: 0 0 6px #4aa8ff55, inset 0 0 6px #4aa8ff22; }
  .tabs button.z-bt.on { color: #7dffb4; background: #16231c; box-shadow: 0 0 14px #2fd77aaa, inset 0 0 8px #2fd77a44; }
  .tabs button.z-hyjal.on { color: #a6d4ff; background: #16202b; box-shadow: 0 0 14px #4aa8ffaa, inset 0 0 8px #4aa8ff44; }
  .tabs .zl { align-self: center; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: #6f6790; margin: 0 0.3rem 0 0.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.8rem; }
  .card { background: #1b1726; border: 1px solid #2a2438; border-radius: 12px; padding: 0.8rem 0.9rem; }
  .row { display: flex; gap: 0.6rem; padding: 0.28rem 0; border-bottom: 1px solid #221d2e; font-size: 0.92rem; align-items: baseline; }
  .row:last-child { border-bottom: 0; }
  .row .lb { color: #9d94b3; flex: 0 0 44%; }
  .row .pl { font-weight: 600; }
  .row .alt { color: #6f6790; font-size: 0.8rem; font-weight: 400; }
  .mk { display: inline-block; width: 1.1em; text-align: center; margin-right: 0.3rem; font-size: 1.05em; }
  .warn { color: #ffb8b8; } .banner { background: #3a2030; border: 1px solid #ff8f8f55; color: #ffb8b8; border-radius: 10px; padding: 0.6rem 0.9rem; margin: 0.6rem 0; font-size: 0.9rem; }
  .note { color: #b8aed3; font-size: 0.88rem; font-style: italic; margin: 0.5rem 0 0; }
  .who { font-size: 0.85rem; color: #9d94b3; font-weight: 400; }
  .err { background: #3a2030; border: 1px solid #ff8f8f55; color: #ffb8b8; border-radius: 10px; padding: 0.7rem 0.9rem; margin: 0.8rem 0; }
  .diagram { margin: 0.4rem 0 1rem; }
  .diagram img { max-width: 100%; border-radius: 12px; border: 1px solid #2a2438; display: block; }
  .diagram figcaption { font-size: 0.8rem; color: #6f6790; margin-top: 0.3rem; }
</style></head><body><style>
  .topnav { position: sticky; top: 0; z-index: 1000; display: flex; flex-wrap: wrap; gap: 0.1rem; align-items: center; justify-content: center;
            background: #171420; border-bottom: 1px solid #2a2438; padding: 0.4rem 0.8rem;
            font: 600 13px/1 "Segoe UI", system-ui, sans-serif; }
  .topnav .tn-logo { width: 22px; height: 22px; border-radius: 50%; margin-right: 0.45rem; flex: none; }
  .topnav a { color: #b8aed3; text-decoration: none; padding: 0.45rem 0.6rem; border-radius: 7px; white-space: nowrap; }
  .topnav a:hover { background: #241f31; color: #e9e5f2; }
  .topnav a.on { color: #b678f0; background: #241f31; }
</style><nav class="topnav"><img class="tn-logo" src="https://bloodl.github.io/vortex-loot/icon.png" alt=""><a href="https://bloodl.github.io/vortex-loot/">Home</a><a href="https://bloodl.github.io/vortex-loot/rules.html">Rules</a><a href="https://bloodl.github.io/vortex-loot/loot-history.html">Loot History</a><a href="https://bloodl.github.io/vortex-loot/wishlist.html">Wishlist</a><a href="https://bloodl.github.io/vortex-loot/api.html">Commands</a><a href="https://bloodl.github.io/vortex-loot/dashboard.html">Standings 🔒</a><a href="https://bloodl.github.io/vortex-loot/officers.html">Officers 🔒</a><a href="https://bloodl.github.io/vortex-loot/marks.html">Marks 🔒</a></nav><div class="page">
  <h1>⚔️ Raid assignments</h1>
  <p class="sub" id="who">Loading tonight's comp…</p>
  <div id="app"></div>
<script>
"use strict";
var API = "https://enr.tail10d5e9.ts.net" || location.origin;
var state = null, current = null;
var app = document.getElementById("app"), whoEl = document.getElementById("who");
function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

// WoW class colours (names light up like the sheet's roster).
var CLASS_COLOR = { Warrior: "#C69B6D", Paladin: "#F48CBA", Hunter: "#AAD372", Rogue: "#FFF468", Priest: "#FFFFFF", Shaman: "#0070DD", Mage: "#3FC7EB", Warlock: "#8788EE", Druid: "#FF7C0A" };
var classOf = {};
// Raid markers: colour + glyph, in the game's order.
var MARK = { star: ["#FFD100", "★"], circle: ["#FF7F3F", "●"], diamond: ["#D57FFF", "◆"], triangle: ["#4FE04F", "▲"], moon: ["#C9D3E0", "☾"], square: ["#3FA7FF", "■"], cross: ["#FF4040", "✖"], skull: ["#FFFFFF", "☠"] };
// Section title keyword -> Wowhead icon name.
var ICONS = [
  [/bop|blessing of protection/i, "spell_holy_sealofprotection"], [/misdirect/i, "ability_hunter_misdirection"], [/bloodlust/i, "spell_nature_bloodlust"],
  [/innervate/i, "spell_nature_lightning"], [/power infusion/i, "spell_holy_powerinfusion"], [/fear ward/i, "spell_holy_excorcism"], [/decurse/i, "spell_holy_removecurse"],
  [/soulstone/i, "spell_shadow_soulgem"], [/tranq/i, "spell_nature_drowsy"], [/scorpid/i, "ability_hunter_criticalshot"], [/spellsteal/i, "spell_arcane_arcane02"],
  [/curse of tongues|curses/i, "spell_shadow_curseoftounges"], [/curse of weakness/i, "spell_shadow_curseofmannoroth"], [/frost trap/i, "spell_frost_chainsofice"],
  [/kick|interrupt/i, "ability_kick"], [/shadowfiend/i, "spell_shadow_shadowfiend"], [/taunt/i, "spell_nature_reincarnation"], [/dispel/i, "spell_holy_dispelmagic"],
  [/healing reduction/i, "ability_rogue_disembowel"], [/soak/i, "spell_shadow_lifedrain02"], [/seethe/i, "ability_warrior_challange"], [/zone|position/i, "inv_misc_map02"],
  [/tank/i, "ability_defend"], [/heal/i, "spell_holy_flashheal"], [/swap|groups/i, "inv_misc_groupneedmore"],
];
function iconFor(title) { for (var i = 0; i < ICONS.length; i++) if (ICONS[i][0].test(title)) return '<img src="https://wow.zamimg.com/images/wow/icons/medium/' + ICONS[i][1] + '.jpg" alt="" loading="lazy">'; return ""; }
function name(n) { var c = CLASS_COLOR[classOf[n]]; return c ? '<span style="color:' + c + '">' + esc(n) + '</span>' : esc(n); }
function names(list) { return list.map(name).join(", "); }
function labelHtml(lb) {
  var m = /^(star|circle|diamond|triangle|moon|square|cross|skull)\b/i.exec(lb);
  if (m) { var k = MARK[m[1].toLowerCase()]; return '<span class="mk" style="color:' + k[0] + '">' + k[1] + '</span>' + esc(lb); }
  return esc(lb);
}

function render() {
  var b = state.bosses.find(function (x) { return x.id === current; }) || state.bosses[0];
  if (!b) { app.innerHTML = '<div class="err">No boss templates.</div>'; return; }
  current = b.id;
  var roles = { tank: 0, healer: 0, melee: 0, ranged: 0 };
  state.players.forEach(function (p) { roles[p.role] = (roles[p.role] || 0) + 1; classOf[p.main] = p.cls; });
  whoEl.innerHTML = "<b>" + esc(state.event.title || "Raid") + "</b> — " + esc(state.event.date) + " · " + state.players.length + " rostered (" +
    roles.tank + " tanks · " + roles.healer + " healers · " + roles.melee + " melee · " + roles.ranged + " ranged) · " + (state.live ? "live comp" : "cached comp");
  // Tabs grouped by zone with a small label, each button glowing in its zone colour.
  var zoneClass = function (z) { return /black temple/i.test(z) ? 'z-bt' : /hyjal/i.test(z) ? 'z-hyjal' : ''; };
  var zones = [];
  state.bosses.forEach(function (x) { if (zones.indexOf(x.zone) < 0) zones.push(x.zone); });
  var h = '<div class="tabs">' + zones.map(function (z) {
    return '<span class="zl">' + esc(z) + '</span>' + state.bosses.filter(function (x) { return x.zone === z; }).map(function (x) {
      return '<button data-id="' + x.id + '" class="' + zoneClass(x.zone) + (x.id === b.id ? ' on' : '') + '">' + esc(x.name) + '</button>';
    }).join('');
  }).join('') + '</div>';
  h += '<h2>' + esc(b.name) + ' <span class="who">' + esc(b.zone) + '</span></h2>';
  // Room diagrams: the template can list several (Illidan's phases); default one per boss id.
  // diagrams === false: no picture yet (the sheet's was wrong; a hand-drawn one is coming).
  var diags = b.diagrams === false ? [] : (b.diagrams && b.diagrams.length) ? b.diagrams : [{ file: b.id + '.jpg', caption: 'Room positions — ' + b.name }];
  diags.forEach(function (d, i) {
    h += '<figure class="diagram" id="diag' + i + '" hidden><img id="diagimg' + i + '" alt="' + esc(d.caption) + '"><figcaption>' + esc(d.caption) + '</figcaption></figure>';
  });
  if (b.warnings.length) h += '<div class="banner">⚠ ' + b.warnings.map(esc).join('<br>') + '</div>';
  h += '<div class="grid">';
  b.sections.forEach(function (s) {
    h += '<div class="card"><h3>' + iconFor(s.title) + esc(s.title) + '</h3>';
    s.rows.forEach(function (r) {
      var pl = r.list ? names(r.list) : (r.player ? name(r.player) : '<span class="warn">unfilled</span>');
      var alt = ''; // a decision, not a guessing game — alternatives stay in the data, not on the page
      var res = (r.resist ? ' <span class="alt">' + esc(r.resist) + '</span>' : '') + (r.flex ? ' <span class="alt">flex: ' + esc(r.flex) + '</span>' : '') + (r.backup ? ' <span class="alt">· backup ' + name(r.backup) + '</span>' : '');
      var wr = r.warn ? ' <span class="warn">⚠ ' + esc(r.warn) + '</span>' : '';
      var lb = r.arrow ? name(r.label) + ' →' : labelHtml(r.label);
      h += '<div class="row"><span class="lb">' + lb + '</span><span class="pl">' + pl + alt + res + wr + '</span></div>';
    });
    h += '</div>';
  });
  h += '</div>';
  b.notes.forEach(function (n) { h += '<p class="note">' + esc(n) + '</p>'; });
  if (b.groupsExport) {
    h += '<div class="card" style="margin-top:0.8rem"><h3>' + iconFor('groups') + 'Groups for this boss — comp-export layout <button id="copygroups" style="margin-left:auto">📋 Copy for MRT</button></h3>' +
      '<pre id="groupstext" style="margin:0;white-space:pre-wrap;font:13px/1.5 Consolas,ui-monospace,monospace;color:#cfc7e2">' + esc(b.groupsExport) + '</pre></div>';
  }
  app.innerHTML = h;
  var cg = document.getElementById('copygroups');
  if (cg) cg.addEventListener('click', function () {
    var t = document.getElementById('groupstext').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { cg.textContent = '✓ Copied'; setTimeout(function () { cg.textContent = '📋 Copy for MRT'; }, 1500); })
      .catch(function () { var r = document.createRange(); r.selectNodeContents(document.getElementById('groupstext')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); cg.textContent = 'Select-all done — Ctrl+C'; });
  });
  // Optional room diagrams: shown only when the image exists on the site.
  diags.forEach(function (d, i) {
    var img = document.getElementById('diagimg' + i);
    img.onload = function () { document.getElementById('diag' + i).hidden = false; };
    img.onerror = function () { document.getElementById('diag' + i).hidden = true; };
    img.src = 'images/assign/' + d.file;
  });
  app.querySelectorAll('.tabs button').forEach(function (btn) { btn.addEventListener('click', function () { current = btn.dataset.id; render(); try { sessionStorage.setItem('assignboss', current); } catch (e) {} }); });
}

if (!API || API.indexOf('http') !== 0) {
  app.innerHTML = '<div class="err">Assignments aren\'t switched on yet — ask an officer.</div>';
} else {
  try { current = sessionStorage.getItem('assignboss'); } catch (e) {}
  fetch(API + '/api/assignments').then(function (r) { return r.json(); })
    .then(function (j) { if (j.error) throw new Error(j.error); state = j; render(); })
    .catch(function (e) { whoEl.textContent = ''; app.innerHTML = '<div class="err">Couldn\'t load assignments (' + esc(e.message) + ') — the server runs on the guild PC; try again in a bit.</div>'; });
}
</script></div></body></html>
